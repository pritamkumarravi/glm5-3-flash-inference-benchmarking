apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dynamo-etcd
  namespace: glm53-research
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: etcd
  namespace: glm53-research
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: dynamo-etcd}
  template:
    metadata:
      labels: {app: dynamo-etcd}
    spec:
      nodeSelector:
        kubernetes.io/hostname: glm53-h100-0
      containers:
        - name: etcd
          image: quay.io/coreos/etcd:v3.6.4
          env:
            - {name: NVIDIA_VISIBLE_DEVICES, value: void}
          command: [/usr/local/bin/etcd]
          args:
            - --name=default
            - --data-dir=/data
            - --listen-client-urls=http://0.0.0.0:2379
            - --advertise-client-urls=http://etcd:2379
            - --listen-peer-urls=http://127.0.0.1:2380
            - --initial-advertise-peer-urls=http://127.0.0.1:2380
            - --initial-cluster=default=http://127.0.0.1:2380
          ports:
            - {name: client, containerPort: 2379}
          resources:
            requests: {cpu: '1', memory: 1Gi}
            limits: {memory: 2Gi}
          readinessProbe:
            httpGet: {path: /health, port: client}
            periodSeconds: 5
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: dynamo-etcd}
---
apiVersion: v1
kind: Service
metadata:
  name: etcd
  namespace: glm53-research
spec:
  selector: {app: dynamo-etcd}
  ports:
    - {name: client, port: 2379, targetPort: client}
